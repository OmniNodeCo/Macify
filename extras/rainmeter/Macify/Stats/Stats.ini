; Macify Stats - macOS-style CPU / memory / disk widget for Rainmeter.
; Installed by tools\Install-RainmeterWidgets.ps1 into Documents\Rainmeter\Skins\Macify\Stats\

[Rainmeter]
Update=2000
AccurateText=1
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=Macify Stats
Author=Macify
Description=macOS-style CPU, memory and disk widget.
Version=1.0

[MeasureCPU]
Measure=CPU

[MeasureRAMUsed]
Measure=PhysicalMemory

[MeasureRAMTotal]
Measure=PhysicalMemory
Total=1

[MeasureRAM]
Measure=Calc
Formula=MeasureRAMUsed / MeasureRAMTotal * 100
MinValue=0
MaxValue=100

[MeasureDiskFree]
Measure=FreeDiskSpace
Drive=C:

[MeasureDiskTotal]
Measure=FreeDiskSpace
Drive=C:
Total=1

[MeasureDisk]
Measure=Calc
Formula=(1 - MeasureDiskFree / MeasureDiskTotal) * 100
MinValue=0
MaxValue=100

[MeterTitle]
Meter=String
X=4
Y=0
FontFace=Inter
FontSize=13
FontWeight=600
FontColor=255,255,255,230
StringEffect=Shadow
FontEffectColor=0,0,0,160
AntiAlias=1
Text=System

[MeterCPULabel]
Meter=String
MeasureName=MeasureCPU
X=4
Y=24
FontFace=Inter
FontSize=12
FontColor=255,255,255,220
StringEffect=Shadow
FontEffectColor=0,0,0,160
AntiAlias=1
Text=CPU %1%

[MeterCPUBar]
Meter=Bar
MeasureName=MeasureCPU
X=4
Y=42
W=170
H=7
MaxValue=100
BarColor=10,132,255,255
SolidColor=255,255,255,50

[MeterRAMLabel]
Meter=String
MeasureName=MeasureRAM
X=4
Y=56
FontFace=Inter
FontSize=12
FontColor=255,255,255,220
StringEffect=Shadow
FontEffectColor=0,0,0,160
AntiAlias=1
Text=Memory %1%

[MeterRAMBar]
Meter=Bar
MeasureName=MeasureRAM
X=4
Y=74
W=170
H=7
MaxValue=100
BarColor=48,209,88,255
SolidColor=255,255,255,50

[MeterDiskLabel]
Meter=String
MeasureName=MeasureDisk
X=4
Y=88
FontFace=Inter
FontSize=12
FontColor=255,255,255,220
StringEffect=Shadow
FontEffectColor=0,0,0,160
AntiAlias=1
Text=Disk C: %1%

[MeterDiskBar]
Meter=Bar
MeasureName=MeasureDisk
X=4
Y=106
W=170
H=7
MaxValue=100
BarColor=255,159,10,255
SolidColor=255,255,255,50
