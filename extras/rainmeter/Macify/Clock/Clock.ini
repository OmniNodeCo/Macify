; Macify Clock - macOS-style desktop clock widget for Rainmeter.
; Installed by tools\Install-RainmeterWidgets.ps1 into Documents\Rainmeter\Skins\Macify\Clock\

[Rainmeter]
Update=1000
AccurateText=1
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=Macify Clock
Author=Macify
Description=macOS-style desktop clock widget.
Version=1.0

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%A, %B %#d

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=0
Y=0
FontFace=Inter
FontSize=52
FontWeight=600
FontColor=255,255,255,255
StringEffect=Shadow
FontEffectColor=0,0,0,160
AntiAlias=1
Text=%1

[MeterDate]
Meter=String
MeasureName=MeasureDate
X=4
Y=64
FontFace=Inter
FontSize=16
FontColor=255,255,255,220
StringEffect=Shadow
FontEffectColor=0,0,0,160
AntiAlias=1
Text=%1
